{% extends 'base.html' %}
{% block title %}Contact Us — Traveloop{% endblock %}

{% block content %}
<div class="page-container" style="max-width:800px;margin:2rem auto;padding:2rem;background:var(--bg-card);border:var(--border-sketch);border-radius:var(--radius);box-shadow:var(--shadow-sketch);">
  <h1 style="font-family:'Caveat',cursive;font-size:3rem;color:var(--accent);margin-bottom:1.5rem;text-align:center;">Contact Us</h1>
  
  <div style="font-size:1.05rem;line-height:1.7;color:var(--text-secondary);text-align:center;">
    <p style="margin-bottom:2rem;">Have a question, suggestion, or just want to say hi? We'd love to hear from you!</p>
    
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.5rem;margin-top:2rem;">
      <div style="padding:1.5rem;border:1px dashed var(--border-color);border-radius:var(--radius);">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="margin-bottom:1rem;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <h4 style="color:var(--text-primary);margin-bottom:0.5rem;">Email Support</h4>
        <p>support@traveloop.com</p>
      </div>
      <div style="padding:1.5rem;border:1px dashed var(--border-color);border-radius:var(--radius);">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="margin-bottom:1rem;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <h4 style="color:var(--text-primary);margin-bottom:0.5rem;">Phone</h4>
        <p>+1 (555) 123-4567</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
