{% load static %}
<header class="notes-nav-header">

  <a href="{% url 'dashboard' %}" class="notes-nav-logo" aria-label="Back to Traveloop dashboard">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-.5-.5-2.5 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.7l-1.2 3.6c-.2.5.1 1 .6 1.2l6.5 3.3-3.6 3.6-3.8-.9c-.4-.1-.8.1-1 .5l-1.3 2.6c-.2.5 0 1 .5 1.2l5.4 1.8 1.8 5.4c.2.5.7.7 1.2.5l2.6-1.3c.4-.2.6-.6.5-1l-.9-3.8 3.6-3.6 3.3 6.5c.2.5.7.8 1.2.6l3.6-1.2c.5-.2.8-.6.7-1.1z"/>
    </svg>
    Traveloop
  </a>

  <button class="notes-mobile-toggle" id="notesMobileToggle" aria-label="Toggle navigation menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <nav class="notes-nav-links" id="notesNavLinks" aria-label="Notes section navigation">
    <a href="{% url 'dashboard' %}"
       class="notes-nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      Dashboard
    </a>
    <a href="{% url 'notes:notes_list' %}"
       class="notes-nav-link {% if 'notes' in request.resolver_match.app_names %}active{% endif %}">
      Trip Notes
    </a>
  </nav>

  <div class="notes-nav-right">
    <div class="theme-toggle" id="themeToggle" title="Toggle dark/light mode"
         role="button" tabindex="0" aria-label="Toggle dark/light mode">
      <div class="toggle-thumb" id="toggleThumb">
        <svg class="icon-sun" width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </div>
    </div>
    {% if user.is_authenticated %}
      <a href="{% url 'logout' %}" class="btn btn-ghost btn-sm">Logout</a>
    {% else %}
      <a href="{% url 'login' %}" class="btn btn-outline btn-sm">Login</a>
    {% endif %}
  </div>

</header>
