<header class="nav-header">
  <a href="{% url 'dashboard' %}" class="nav-logo">
    <span class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(45deg)"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-.5-.5-2.5 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.7l-1.2 3.6c-.2.5.1 1 .6 1.2l6.5 3.3-3.6 3.6-3.8-.9c-.4-.1-.8.1-1 .5l-1.3 2.6c-.2.5 0 1 .5 1.2l5.4 1.8 1.8 5.4c.2.5.7.7 1.2.5l2.6-1.3c.4-.2.6-.6.5-1l-.9-3.8 3.6-3.6 3.3 6.5c.2.5.7.8 1.2.6l3.6-1.2c.5-.2.8-.6.7-1.1z"></path></svg></span> Traveloop
  </a>

  <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>

  <ul class="nav-links" id="navLinks">
    {% if user.is_authenticated %}
    <li><a href="{% url 'notes:notes_list' %}" class="{% if 'notes' in request.resolver_match.app_names %}active{% endif %}">Trip Notes</a></li>
    <li><a href="{% url 'trip_list' %}" class="{% if request.resolver_match.url_name == 'trip_list' %}active{% endif %}">My Trips</a></li>
    <li><a href="{% url 'trip_create' %}" class="{% if request.resolver_match.url_name == 'trip_create' %}active{% endif %}">Create Trip</a></li>
    <li><a href="{% url 'explore' %}" class="{% if request.resolver_match.url_name == 'explore' %}active{% endif %}">Explore</a></li>
    <li><a href="{% url 'community:community_list' %}" class="{% if 'community' in request.resolver_match.app_names %}active{% endif %}">Community</a></li>
    <li><a href="{% url 'destinations:activity-search' %}" class="{% if request.resolver_match.url_name == 'activity-search' %}active{% endif %}">Browse Activities</a></li>

    {% endif %}
  </ul>

  <div class="nav-right">
    <div class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
      <div class="toggle-thumb"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></div>
    </div>
    {% if user.is_authenticated %}
    <a href="{% url 'profile' %}" class="btn btn-ghost btn-sm" title="My Profile">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </a>
    <a href="{% url 'logout' %}" class="btn btn-ghost btn-sm">Logout</a>
    {% else %}
    <a href="{% url 'login' %}" class="btn btn-outline btn-sm">Login</a>
    {% endif %}
  </div>
</header>
