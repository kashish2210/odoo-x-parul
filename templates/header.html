<header class="nav-header">
  <a href="{% url 'dashboard' %}" class="nav-logo">
    <span class="logo-icon">✈️</span> Traveloop
  </a>

  <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">☰</button>

  <ul class="nav-links" id="navLinks">
    {% if user.is_authenticated %}
    <li><a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a></li>
    <li><a href="#">My Trips</a></li>
    <li><a href="#">Explore</a></li>
    {% endif %}
  </ul>

  <div class="nav-right">
    <div class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
      <div class="toggle-thumb">☀️</div>
    </div>
    {% if user.is_authenticated %}
    <a href="{% url 'logout' %}" class="btn btn-ghost btn-sm">Logout</a>
    {% else %}
    <a href="{% url 'login' %}" class="btn btn-outline btn-sm">Login</a>
    {% endif %}
  </div>
</header>
